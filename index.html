<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حلول تك</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1220;--card:#131c31;--tx:#e8eefc;--mu:#9fb0d3;--ac:#4f8cff;--ac2:#22d3ee;--bd:#233152}
*{box-sizing:border-box;margin:0}
body{font-family:Tajawal,Tahoma,sans-serif;background:var(--bg);color:var(--tx);line-height:1.7}
a{color:inherit;text-decoration:none}
nav{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:12px 5%;background:rgba(11,18,32,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
.brand{font-weight:800;font-size:20px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;color:transparent}
.nv{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-block;border:0;cursor:pointer;font:inherit;font-weight:700;padding:9px 18px;border-radius:10px;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#06101f}
.btn.o{background:transparent;color:var(--tx);border:1px solid var(--ac)}
.btn.d{background:#e5484d;color:#fff;padding:5px 12px}
main{max-width:1050px;margin:auto;padding:0 5% 60px}
.hero{text-align:center;padding:70px 0 40px}
.hero h1{font-size:clamp(28px,6vw,46px);font-weight:800;line-height:1.3}
.hero p{color:var(--mu);max-width:560px;margin:14px auto 24px}
h2{margin:36px 0 16px;font-size:24px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px;transition:.2s}
a.c:hover{transform:translateY(-4px);border-color:var(--ac)}
.c .i{font-size:38px}
.c h3{margin:8px 0 4px}
.c p,.mu{color:var(--mu);font-size:15px}
.box{max-width:420px;margin:50px auto}
input,textarea{width:100%;font:inherit;padding:11px;margin:6px 0 12px;border-radius:10px;border:1px solid var(--bd);background:#0d1527;color:var(--tx)}
label{font-size:14px;color:var(--mu)}
ul.l{padding-right:20px;margin:10px 0 20px}
.msg{padding:10px;border-radius:10px;margin:10px 0;background:#1b2a4a}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:right}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
.ov{overflow-x:auto}
.price{color:var(--ac2);font-weight:800}
.ct{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.ct a,.ct div{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px}
.ct a:hover{border-color:var(--ac)}
.ct .i{font-size:26px}.ct small{display:block;color:var(--mu);font-size:13px}.ct b{direction:ltr;unicode-bidi:plaintext}
footer{text-align:center;color:var(--mu);font-size:14px;padding:24px 5%;border-top:1px solid var(--bd)}
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="app"></main>
<footer>© حلول تك — جميع الحقوق محفوظة</footer>
<script>
// ===== الإعدادات: ضع رابط Apps Script هنا =====
const API='PASTE_APPS_SCRIPT_URL_HERE';

// ===== بيانات التواصل: عدّلها ببياناتك (اترك الفارغ ليختفي) =====
const CONTACT={
  phone:'+968 9559 9161',
  whatsapp:'+96895599161',
  email:'k2.7aaa@hotmail.com',
  address:'',
  hours:'على مدار الساعة (24 ساعة)',
  instagram:'',
  x:'',
  snapchat:''
};

const S=[
{id:'cv',i:'📄',t:'إنشاء السيرة الذاتية',d:'سيرة ذاتية احترافية تبرزك أمام الشركات.',l:['تصميم عصري ومرتب','عربي وإنجليزي','تعديل وتحديث مستمر']},
{id:'train',i:'🎓',t:'التدريب',d:'دورات وتدريب عملي في المهارات التقنية والمهنية.',l:['دورات حضورية وعن بعد','تدريب فردي وجماعي','شهادات حضور']},
{id:'support',i:'🛠️',t:'الدعم الفني',d:'حلول سريعة لمشاكل الأجهزة والبرامج والشبكات.',l:['صيانة وإصلاح','دعم عن بعد','تثبيت وتهيئة الأنظمة']},
{id:'net',i:'📡',t:'تركيب الشبكات والكاميرات',d:'تركيب مقويات الإشارة وكاميرات المراقبة وتغطية كاملة للمكان.',l:['مقويات واي فاي','كاميرات مراقبة مع مشاهدة عن بعد','تمديد وتنظيم الكيبلات']},
{id:'web',i:'🌐',t:'تصميم المواقع',d:'مواقع حديثة وسريعة تناسب نشاطك وتعمل على الجوال.',l:['مواقع تعريفية ومتاجر','تصميم جذاب','استضافة ودعم']},
{id:'shop',i:'🛒',t:'المنتجات',d:'منتجات متنوعة نختارها لك بعناية.',l:[]}
];
let tok=localStorage.getItem('t'),user=JSON.parse(localStorage.getItem('u')||'null');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(action,data={}){
  if(API.startsWith('PASTE'))return{ok:false,msg:'الموقع غير مربوط بقاعدة البيانات بعد'};
  try{const r=await fetch(API,{method:'POST',body:JSON.stringify({action,token:tok,...data})});return await r.json()}
  catch(e){return{ok:false,msg:'تعذر الاتصال بالخادم'}}
}
function nav(){
  $('#nav').innerHTML=`<a class="brand" href="#/">⚡ حلول تك</a><div class="nv">`+
  (user?`<a class="btn o" href="#/sections">الأقسام</a>${user.role==='admin'?'<a class="btn o" href="#/admin">لوحة الأدمن</a>':''}<span class="mu">${esc(user.name)}</span><button class="btn" onclick="logout()">خروج</button>`
  :`<a class="btn o" href="#/login">تسجيل الدخول</a><a class="btn" href="#/register">إنشاء حساب</a>`)+`</div>`;
}
function logout(){tok=null;user=null;localStorage.clear();location.hash='#/';route()}
function setUser(r){tok=r.token;user=r.user;localStorage.setItem('t',tok);localStorage.setItem('u',JSON.stringify(user));location.hash='#/sections'}

function home(){return`<section class="hero"><h1>حلول تك<br><span style="font-size:.5em;font-weight:700;color:var(--mu)">كل احتياجك التقني في مكان واحد</span></h1><p>سيرة ذاتية، تدريب، دعم فني، شبكات وكاميرات، تصميم مواقع، ومنتجات متنوعة بجودة وسعر مناسب.</p>
<a class="btn" href="#/${user?'sections':'register'}">${user?'تصفح الأقسام':'ابدأ الآن'}</a></section>
<h2>خدماتنا</h2><div class="g">${S.map(s=>`<div class="c"><div class="i">${s.i}</div><h3>${s.t}</h3><p>${s.d}</p></div>`).join('')}</div>${contact()}`}

function contact(){
  const C=CONTACT,d=v=>String(v).replace(/\D/g,'');
  const it=[
    C.phone&&['📞','اتصل بنا',C.phone,'tel:'+d(C.phone)],
    C.whatsapp&&['💬','واتساب',C.whatsapp,'https://wa.me/'+d(C.whatsapp)],
    C.email&&['✉️','البريد الإلكتروني',C.email,'mailto:'+C.email],
    C.address&&['📍','العنوان',C.address,''],
    C.hours&&['🕒','أوقات العمل',C.hours,''],
    C.instagram&&['📷','انستقرام','@'+C.instagram.replace('@',''),'https://instagram.com/'+C.instagram.replace('@','')],
    C.x&&['𝕏','منصة X','@'+C.x.replace('@',''),'https://x.com/'+C.x.replace('@','')],
    C.snapchat&&['👻','سناب شات',C.snapchat,'https://snapchat.com/add/'+C.snapchat]
  ].filter(Boolean);
  if(!it.length)return'';
  return`<h2>تواصل معنا</h2><div class="ct">${it.map(([i,l,v,h])=>{
    const b=`<span class="i">${i}</span><span><small>${l}</small><b>${esc(v)}</b></span>`;
    return h?`<a href="${esc(h)}" target="_blank" rel="noopener">${b}</a>`:`<div>${b}</div>`}).join('')}</div>`;
}

function sections(){
  if(!user){location.hash='#/login';return''}
  return`<h2>الأقسام</h2><div class="g">${S.map(s=>`<a class="c" href="#/s/${s.id}"><div class="i">${s.i}</div><h3>${s.t}</h3><p>${s.d}</p></a>`).join('')}</div>`}

async function section(id){
  if(!user){location.hash='#/login';return''}
  const s=S.find(x=>x.id===id);if(!s)return'<p>القسم غير موجود</p>';
  let h=`<a class="mu" href="#/sections">← رجوع للأقسام</a><h2>${s.i} ${s.t}</h2><p class="mu">${s.d}</p>`;
  if(id==='shop'){
    const r=await api('getProducts');
    h+=r.ok&&r.products.length?`<div class="g" style="margin-top:16px">${r.products.map(p=>`<div class="c"><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><p class="price">${esc(p.price)}</p><button class="btn" onclick="req('منتج: ${esc(p.name).replace(/'/g,'')}')">اطلب الآن</button></div>`).join('')}</div>`
      :`<div class="msg">${r.ok?'لا توجد منتجات حالياً':esc(r.msg)}</div>`;
  }else{
    h+=`<ul class="l">${s.l.map(x=>`<li>${x}</li>`).join('')}</ul><div class="c"><h3>اطلب الخدمة</h3><label>تفاصيل طلبك</label><textarea id="nt" rows="4"></textarea><button class="btn" onclick="req('${s.t}')">إرسال الطلب</button></div>`;
  }
  return h+'<div id="st"></div>';
}
async function req(service){
  const n=$('#nt')?$('#nt').value:'';
  const r=await api('sendRequest',{service,note:n});
  ($('#st')||document.body.appendChild(Object.assign(document.createElement('div'),{id:'st'}))).innerHTML=`<div class="msg">${r.ok?'تم إرسال طلبك بنجاح ✅':esc(r.msg)}</div>`;
}

function authForm(reg){return`<div class="box c"><h2 style="margin-top:0">${reg?'إنشاء حساب':'تسجيل الدخول'}</h2>
${reg?'<label>الاسم</label><input id="n"><label>الجوال</label><input id="p" type="tel">':''}
<label>البريد الإلكتروني</label><input id="e" type="email"><label>كلمة المرور</label><input id="w" type="password">
<button class="btn" style="width:100%" onclick="auth(${reg})">${reg?'تسجيل':'دخول'}</button><div id="st"></div>
<p class="mu" style="margin-top:12px">${reg?'لديك حساب؟ <a href="#/login" style="color:var(--ac)">سجّل دخولك</a>':'ليس لديك حساب؟ <a href="#/register" style="color:var(--ac)">أنشئ حساباً</a>'}</p></div>`}
async function auth(reg){
  const d={email:$('#e').value.trim(),pass:$('#w').value};
  if(reg){d.name=$('#n').value.trim();d.phone=$('#p').value.trim()}
  if(!d.email||!d.pass||(reg&&!d.name)){$('#st').innerHTML='<div class="msg">أكمل جميع الحقول</div>';return}
  const r=await api(reg?'register':'login',d);
  if(r.ok)setUser(r);else $('#st').innerHTML=`<div class="msg">${esc(r.msg)}</div>`;
}

let tab='users';
async function admin(){
  if(!user||user.role!=='admin'){location.hash='#/';return''}
  const r=await api('adminData');if(!r.ok)return`<div class="msg">${esc(r.msg)}</div>`;
  const T=(k,l)=>`<button class="btn ${tab===k?'':'o'}" onclick="tab='${k}';route()">${l}</button>`;
  let h=`<h2>لوحة الأدمن</h2><div class="tabs">${T('users','المستخدمون ('+r.users.length+')')}${T('reqs','الطلبات ('+r.requests.length+')')}${T('prods','المنتجات ('+r.products.length+')')}</div><div class="ov">`;
  if(tab==='users')h+=`<table><tr><th>الاسم</th><th>البريد</th><th>الجوال</th><th>الصلاحية</th><th></th></tr>${r.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.phone)}</td><td>${u.role==='admin'?'أدمن':'عميل'}</td><td>${u.id===user.id?'':`<button class="btn o" style="padding:5px 10px" onclick="adm('setRole',{id:'${u.id}',role:'${u.role==='admin'?'user':'admin'}'})">${u.role==='admin'?'إلغاء أدمن':'ترقية لأدمن'}</button> <button class="btn d" onclick="adm('deleteUser',{id:'${u.id}'},1)">حذف</button>`}</td></tr>`).join('')}</table>`;
  if(tab==='reqs')h+=`<table><tr><th>التاريخ</th><th>العميل</th><th>الخدمة</th><th>التفاصيل</th><th></th></tr>${r.requests.map(q=>`<tr><td>${esc(q.date.slice(0,10))}</td><td>${esc(q.name)}<br><span class="mu">${esc(q.phone)}</span></td><td>${esc(q.service)}</td><td>${esc(q.note)}</td><td><button class="btn d" onclick="adm('deleteRequest',{id:'${q.id}'},1)">حذف</button></td></tr>`).join('')}</table>`;
  if(tab==='prods')h+=`<div class="c" style="margin-bottom:16px"><h3>إضافة منتج</h3><input id="pn" placeholder="اسم المنتج"><input id="pp" placeholder="السعر"><input id="pd" placeholder="الوصف"><button class="btn" onclick="addP()">إضافة</button></div><table>${r.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.price)}</td><td>${esc(p.desc)}</td><td><button class="btn d" onclick="adm('deleteProduct',{id:'${p.id}'},1)">حذف</button></td></tr>`).join('')}</table>`;
  return h+'</div>';
}
async function adm(a,d,c){if(c&&!confirm('متأكد؟'))return;const r=await api(a,d);if(!r.ok)alert(r.msg);route()}
function addP(){adm('addProduct',{name:$('#pn').value,price:$('#pp').value,desc:$('#pd').value})}

async function route(){
  nav();const h=(location.hash.slice(2)||'').split('/');let v='';
  const m=$('#app');m.innerHTML='<p class="mu" style="padding:40px 0">جارٍ التحميل…</p>';
  if(h[0]==='sections')v=sections();
  else if(h[0]==='s')v=await section(h[1]);
  else if(h[0]==='login')v=authForm(0);
  else if(h[0]==='register')v=authForm(1);
  else if(h[0]==='admin')v=await admin();
  else v=home();
  m.innerHTML=v;scrollTo(0,0);
}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
