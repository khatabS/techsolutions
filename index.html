<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حلول تك</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1220;--card:#131c31;--tx:#e8eefc;--mu:#9fb0d3;--ac:#4f8cff;--ac2:#22d3ee;--bd:#233152}
*{box-sizing:border-box;margin:0}
body{font-family:Tajawal,Tahoma,sans-serif;background:var(--bg);color:var(--tx);line-height:1.7}
a{color:inherit;text-decoration:none}
nav{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:12px 5%;background:rgba(11,18,32,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
.brand{font-weight:800;font-size:20px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;color:transparent}
.nv{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-block;border:0;cursor:pointer;font:inherit;font-weight:700;padding:9px 18px;border-radius:10px;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#06101f}
.btn.o{background:transparent;color:var(--tx);border:1px solid var(--ac)}
.btn.d{background:#e5484d;color:#fff;padding:5px 12px}
main{max-width:1050px;margin:auto;padding:0 5% 60px}
.hero{text-align:center;padding:70px 0 40px}
.hero h1{font-size:clamp(28px,6vw,46px);font-weight:800;line-height:1.3}
.hero p{color:var(--mu);max-width:560px;margin:14px auto 24px}
h2{margin:36px 0 16px;font-size:24px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px;transition:.2s}
a.c:hover{transform:translateY(-4px);border-color:var(--ac)}
.c .i{font-size:38px}
.c h3{margin:8px 0 4px}
.c p,.mu{color:var(--mu);font-size:15px}
.box{max-width:420px;margin:50px auto}
input,textarea{width:100%;font:inherit;padding:11px;margin:6px 0 12px;border-radius:10px;border:1px solid var(--bd);background:#0d1527;color:var(--tx)}
label{font-size:14px;color:var(--mu)}
ul.l{padding-right:20px;margin:10px 0 20px}
.msg{padding:10px;border-radius:10px;margin:10px 0;background:#1b2a4a}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:right}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
.ov{overflow-x:auto}
.price{color:var(--ac2);font-weight:800}
.ct{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.ct a,.ct div{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px}
.ct a:hover{border-color:var(--ac)}
.ct .i{font-size:26px}.ct small{display:block;color:var(--mu);font-size:13px}.ct b{direction:ltr;unicode-bidi:plaintext}
footer{text-align:center;color:var(--mu);font-size:14px;padding:24px 5%;border-top:1px solid var(--bd)}
select{font:inherit;padding:6px;border-radius:8px;background:#0d1527;color:var(--tx);border:1px solid var(--bd)}
details summary{list-style:none}
#wa{position:fixed;left:18px;bottom:18px;z-index:9;width:56px;height:56px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.pk.sel{border-color:var(--ac2);box-shadow:0 0 0 2px var(--ac2)}
.st4{counter-reset:n}.st4 .c::before{counter-increment:n;content:counter(n);display:inline-flex;width:32px;height:32px;border-radius:50%;background:var(--ac);color:#06101f;font-weight:800;align-items:center;justify-content:center;margin-bottom:8px}
</style>
</head>
<body>
<nav id="nav"></nav>
<a id="wa" target="_blank" rel="noopener" aria-label="واتساب">💬</a>
<main id="app"></main>
<footer>© حلول تك — جميع الحقوق محفوظة</footer>
<script>
// ===== الإعدادات: ضع رابط Apps Script هنا =====
const API='https://script.google.com/macros/s/AKfycbz0uXTQ9vjmOAKq_0UDq8Jx2eqX_zHKRLwaSpRYXvKioonBhKLY3PHzFHTtN6r2uZegXg/exec';

// ===== بيانات التواصل: عدّلها ببياناتك (اترك الفارغ ليختفي) =====
const CONTACT={
  phone:'+968 9559 9161',
  whatsapp:'+96895599161',
  email:'k2.7aaa@hotmail.com',
  address:'',
  hours:'على مدار الساعة (24 ساعة)',
  instagram:'',
  x:'',
  snapchat:''
};
// معرض الأعمال وآراء العملاء: أضف عناصر وتظهر تلقائياً (الفارغ يختفي)
// ===== قسم السيرة الذاتية: عدّل الباقات والأسعار هنا =====
const CV_DAYS='خلال 24 إلى 48 ساعة';
const CV_PKGS=[
 {n:'أساسية',p:'5 ر.ع',l:['سيرة ذاتية بصفحة واحدة','لغة واحدة (عربي أو إنجليزي)','تعديل واحد مجاني']},
 {n:'احترافية',p:'10 ر.ع',star:1,l:['حتى صفحتين بتصميم مميز','عربي وإنجليزي','3 تعديلات مجانية','متوافقة مع أنظمة ATS']},
 {n:'شاملة',p:'18 ر.ع',l:['كل مميزات الاحترافية','خطاب تقديم (Cover Letter)','تحسين حساب لينكدإن','تعديلات مفتوحة لمدة شهر']}
];
const CV_SAMPLES=[ /* {before:'رابط صورة قبل',after:'رابط صورة بعد',t:'وصف'} */ ];
const GALLERY=[ /* {img:'رابط الصورة',t:'وصف العمل'} */ ];
const REVIEWS=[ /* {n:'اسم العميل',t:'نص الرأي'} */ ];
const FAQ=[
 {q:'كيف أطلب خدمة؟',a:'سجّل حساباً، افتح القسم المطلوب واضغط إرسال الطلب، وسنتواصل معك.'},
 {q:'هل الدعم الفني متوفر عن بعد؟',a:'نعم، نقدم دعماً عن بعد وحضورياً حسب الحالة.'},
 {q:'كيف أتابع حالة طلبي؟',a:'من زر "طلباتي" في الأعلى بعد تسجيل الدخول.'},
 {q:'كيف أتواصل معكم بسرعة؟',a:'عبر الواتساب، ونحن متواجدون على مدار الساعة.'}
];

const S=[
{id:'cv',i:'📄',t:'إنشاء السيرة الذاتية',d:'سيرة ذاتية احترافية تبرزك أمام الشركات.',l:['تصميم عصري ومرتب','عربي وإنجليزي','تعديل وتحديث مستمر']},
{id:'train',i:'🎓',t:'التدريب',d:'دورات وتدريب عملي في المهارات التقنية والمهنية.',l:['دورات حضورية وعن بعد','تدريب فردي وجماعي','شهادات حضور']},
{id:'support',i:'🛠️',t:'الدعم الفني',d:'حلول سريعة لمشاكل الأجهزة والبرامج والشبكات.',l:['صيانة وإصلاح','دعم عن بعد','تثبيت وتهيئة الأنظمة']},
{id:'net',i:'📡',t:'تركيب الشبكات والكاميرات',d:'تركيب مقويات الإشارة وكاميرات المراقبة وتغطية كاملة للمكان.',l:['مقويات واي فاي','كاميرات مراقبة مع مشاهدة عن بعد','تمديد وتنظيم الكيبلات']},
{id:'web',i:'🌐',t:'تصميم المواقع',d:'مواقع حديثة وسريعة تناسب نشاطك وتعمل على الجوال.',l:['مواقع تعريفية ومتاجر','تصميم جذاب','استضافة ودعم']},
{id:'shop',i:'🛒',t:'المنتجات',d:'منتجات متنوعة نختارها لك بعناية.',l:[]}
];
const guestFields=`<label>الاسم</label><input id="gn"><label>رقم الجوال</label><input id="gp" type="tel"><input id="hp" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px">`;
let tok=localStorage.getItem('t'),user=JSON.parse(localStorage.getItem('u')||'null');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(action,data={}){
  if(API.startsWith('PASTE'))return{ok:false,msg:'الموقع غير مربوط بقاعدة البيانات بعد'};
  try{const r=await fetch(API,{method:'POST',body:JSON.stringify({action,token:tok,...data})});return await r.json()}
  catch(e){return{ok:false,msg:'تعذر الاتصال بالخادم'}}
}
function nav(){
  $('#nav').innerHTML=`<a class="brand" href="#/">⚡ حلول تك</a><div class="nv">`+
  (user?`<a class="btn o" href="#/sections">الأقسام</a><a class="btn o" href="#/my">طلباتي</a><a class="btn o" href="#/password">🔑 كلمة المرور</a>${user.role==='admin'?'<a class="btn o" href="#/admin">لوحة الأدمن</a>':''}<span class="mu">${esc(user.name)}</span><button class="btn" onclick="logout()">خروج</button>`
  :`<a class="btn o" href="#/sections">الأقسام</a><a class="btn o" href="#/login">تسجيل الدخول</a><a class="btn" href="#/register">إنشاء حساب</a>`)+`</div>`;
}
function logout(){tok=null;user=null;localStorage.clear();location.hash='#/';route()}
function setUser(r){tok=r.token;user=r.user;localStorage.setItem('t',tok);localStorage.setItem('u',JSON.stringify(user));location.hash=user.mustChange?'#/password':'#/sections'}

function home(){return`<section class="hero"><h1>حلول تك<br><span style="font-size:.5em;font-weight:700;color:var(--mu)">كل احتياجك التقني في مكان واحد</span></h1><p>سيرة ذاتية، تدريب، دعم فني، شبكات وكاميرات، تصميم مواقع، ومنتجات متنوعة بجودة وسعر مناسب.</p>
<a class="btn" href="#/sections">تصفح الأقسام</a>${user?'':' <a class="btn o" href="#/register">إنشاء حساب</a>'}</section>
<h2>خدماتنا</h2><div class="g">${S.map(s=>`<div class="c"><div class="i">${s.i}</div><h3>${s.t}</h3><p>${s.d}</p></div>`).join('')}</div>${gallery()}${reviews()}${faq()}${contact()}`}

function gallery(){return GALLERY.length?`<h2>أعمالنا</h2><div class="g">${GALLERY.map(g=>`<div class="c" style="padding:0;overflow:hidden"><img src="${esc(g.img)}" alt="" style="width:100%;height:190px;object-fit:cover"><p style="padding:12px">${esc(g.t)}</p></div>`).join('')}</div>`:''}
function reviews(){return REVIEWS.length?`<h2>آراء العملاء</h2><div class="g">${REVIEWS.map(r=>`<div class="c"><p>“${esc(r.t)}”</p><h3 style="font-size:16px">— ${esc(r.n)}</h3></div>`).join('')}</div>`:''}
function faq(){return`<h2>الأسئلة الشائعة</h2>${FAQ.map(f=>`<details class="c" style="margin-bottom:10px"><summary style="cursor:pointer;font-weight:700">${esc(f.q)}</summary><p style="margin-top:8px">${esc(f.a)}</p></details>`).join('')}`}
async function my(){if(!user){location.hash='#/login';return''}const r=await api('myRequests');if(!r.ok)return`<div class="msg">${esc(r.msg)}</div>`;
return`<h2>طلباتي</h2>`+(r.requests.length?`<div class="ov"><table><tr><th>التاريخ</th><th>الخدمة</th><th>الحالة</th></tr>${r.requests.map(q=>`<tr><td>${esc(q.date.slice(0,10))}</td><td>${esc(q.service)}</td><td>${esc(q.status||'جديد')}</td></tr>`).join('')}</table></div>`:'<div class="msg">لا توجد طلبات بعد</div>')}
const PWR=[['8 أحرف على الأقل',p=>p.length>=8],['حرف إنجليزي',p=>/[A-Za-z]/.test(p)],['رقم',p=>/\d/.test(p)],['رمز مثل !@#$%',p=>/[^A-Za-z0-9]/.test(p)]];
const pwOk=p=>PWR.every(r=>r[1](p));
const hintHtml=v=>PWR.map(r=>`<div class="mu">${r[1](v)?'✅':'⬜'} ${r[0]}</div>`).join('');
const pwHint=(id,v)=>{$('#'+id).innerHTML=hintHtml(v)};
function passPage(){if(!user){location.hash='#/login';return''}
return`<div class="box c"><h2 style="margin-top:0">تغيير كلمة المرور</h2>${user.mustChange?'<div class="msg">دخلت بكلمة مؤقتة، اختر كلمة مرور جديدة للمتابعة</div>':''}<label>كلمة المرور الحالية</label><input id="o" type="password"><label>كلمة المرور الجديدة</label><input id="w1" type="password" oninput="pwHint('ph',this.value)"><div id="ph" style="margin:-6px 0 12px">${hintHtml('')}</div><label>تأكيد كلمة المرور الجديدة</label><input id="w2" type="password"><button class="btn" style="width:100%" onclick="chp()">حفظ</button><div id="st"></div></div>`}
async function chp(){const a=$('#w1').value,m=t=>$('#st').innerHTML=`<div class="msg">${t}</div>`;
if(!pwOk(a))return m('كلمة المرور الجديدة لا تحقق الشروط');
if(a!==$('#w2').value)return m('كلمتا المرور غير متطابقتين');
const r=await api('changePass',{old:$('#o').value,pass:a});
if(!r.ok)return m(esc(r.msg));
user=r.user;localStorage.setItem('u',JSON.stringify(user));nav();m('تم تغيير كلمة المرور ✅');setTimeout(()=>location.hash='#/sections',1200)}
function forgot(){return`<div class="box c"><h2 style="margin-top:0">استعادة كلمة المرور</h2><label>البريد الإلكتروني</label><input id="e" type="email"><button class="btn" style="width:100%" onclick="fg()">إرسال كلمة مرور مؤقتة</button><div id="st"></div></div>`}
async function fg(){const r=await api('forgot',{email:$('#e').value.trim()});$('#st').innerHTML=`<div class="msg">${r.ok?'إذا كان البريد مسجلاً وصلتك كلمة مرور مؤقتة (تفقد الرسائل غير المرغوبة)':esc(r.msg)}</div>`}
function contact(){
  const C=CONTACT,d=v=>String(v).replace(/\D/g,'');
  const it=[
    C.phone&&['📞','اتصل بنا',C.phone,'tel:'+d(C.phone)],
    C.whatsapp&&['💬','واتساب',C.whatsapp,'https://wa.me/'+d(C.whatsapp)],
    C.email&&['✉️','البريد الإلكتروني',C.email,'mailto:'+C.email],
    C.address&&['📍','العنوان',C.address,''],
    C.hours&&['🕒','أوقات العمل',C.hours,''],
    C.instagram&&['📷','انستقرام','@'+C.instagram.replace('@',''),'https://instagram.com/'+C.instagram.replace('@','')],
    C.x&&['𝕏','منصة X','@'+C.x.replace('@',''),'https://x.com/'+C.x.replace('@','')],
    C.snapchat&&['👻','سناب شات',C.snapchat,'https://snapchat.com/add/'+C.snapchat]
  ].filter(Boolean);
  if(!it.length)return'';
  return`<h2>تواصل معنا</h2><div class="ct">${it.map(([i,l,v,h])=>{
    const b=`<span class="i">${i}</span><span><small>${l}</small><b>${esc(v)}</b></span>`;
    return h?`<a href="${esc(h)}" target="_blank" rel="noopener">${b}</a>`:`<div>${b}</div>`}).join('')}</div>`;
}

function sections(){
  return`<h2>الأقسام</h2><div class="g">${S.map(s=>`<a class="c" href="#/s/${s.id}"><div class="i">${s.i}</div><h3>${s.t}</h3><p>${s.d}</p></a>`).join('')}</div>`}

async function section(id){
  const s=S.find(x=>x.id===id);if(!s)return'<p>القسم غير موجود</p>';
  if(id==='cv')return cvPage(s);
  let h=`<a class="mu" href="#/sections">← رجوع للأقسام</a><h2>${s.i} ${s.t}</h2><p class="mu">${s.d}</p>`;
  if(id==='shop'){
    const r=await api('getProducts');
    h+=r.ok&&r.products.length?`<div class="g" style="margin-top:16px">${r.products.map(p=>`<div class="c">${p.img?`<img src="${esc(p.img)}" alt="" style="width:100%;height:170px;object-fit:cover;border-radius:10px;margin-bottom:8px">`:''}<h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><p class="price">${esc(p.price)}</p><button class="btn" onclick="req('منتج: ${esc(p.name).replace(/'/g,'')}')">اطلب الآن</button></div>`).join('')}</div>`
      :`<div class="msg">${r.ok?'لا توجد منتجات حالياً':esc(r.msg)}</div>`;
    if(!user)h+=`<div class="c" style="margin-top:16px"><h3>بياناتك للطلب</h3>${guestFields}</div>`;
  }else{
    h+=`<ul class="l">${s.l.map(x=>`<li>${x}</li>`).join('')}</ul><div class="c"><h3>اطلب الخدمة</h3>${user?'':guestFields}<label>تفاصيل طلبك</label><textarea id="nt" rows="4"></textarea><button class="btn" onclick="req('${s.t}')">إرسال الطلب</button></div>`;
  }
  return h+'<div id="st"></div>';
}
async function req(service){
  const n=$('#nt')?$('#nt').value:'',show=t=>($('#st')||document.body.appendChild(Object.assign(document.createElement('div'),{id:'st'}))).innerHTML=`<div class="msg">${t}</div>`;
  let r;
  if(user)r=await api('sendRequest',{service,note:n});
  else{const nm=($('#gn')||{value:''}).value.trim(),ph=($('#gp')||{value:''}).value.trim();
    if(!nm||!/^\+?[\d\s]{7,15}$/.test(ph))return show('أدخل اسمك ورقم جوال صحيح في الخانات');
    r=await api('guestRequest',{service,note:n,name:nm,phone:ph,hp:($('#hp')||{value:''}).value})}
  show(r.ok?'تم إرسال طلبك بنجاح ✅ وسنتواصل معك قريباً':esc(r.msg));
}

let cvPkg=1;
function cvPage(s){
  cvPkg=Math.min(1,CV_PKGS.length-1);
  const pk=CV_PKGS.map((k,i)=>`<div class="c pk${i===cvPkg?' sel':''}"><h3>${esc(k.n)}${k.star?' ⭐':''}</h3><p class="price" style="font-size:26px">${esc(k.p)}</p><ul class="l">${k.l.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><button class="btn${i===cvPkg?'':' o'}" onclick="cvSel(${i})">اختر هذه الباقة</button></div>`).join('');
  const steps=['أرسل بياناتك عبر النموذج','نجهّز لك المسودة الأولى','تراجعها وتطلب التعديلات','تستلم الملف النهائي PDF وWord'].map((t,i)=>`<div class="c"><h3 style="font-size:16px">${t}</h3></div>`).join('');
  const feats=['🤖 متوافقة مع أنظمة فرز الشركات (ATS)','✏️ تعديلات مجانية حسب الباقة','🔒 بياناتك سرية وتُستخدم لإعداد سيرتك فقط','⏱️ التسليم '+CV_DAYS].map(t=>`<div class="c">${t}</div>`).join('');
  const smp=CV_SAMPLES.length?`<h2>نماذج من أعمالنا</h2><div class="g">${CV_SAMPLES.map(x=>`<div class="c"><div style="display:flex;gap:8px"><div style="flex:1"><small class="mu">قبل</small><img src="${esc(x.before)}" alt="" style="width:100%;border-radius:8px"></div><div style="flex:1"><small class="mu">بعد</small><img src="${esc(x.after)}" alt="" style="width:100%;border-radius:8px"></div></div><p style="margin-top:8px">${esc(x.t)}</p></div>`).join('')}</div>`:'';
  const q=[['ما الملفات التي أستلمها؟','ملف PDF جاهز للإرسال، وملف Word قابل للتعديل.'],['كم يستغرق التسليم؟','المسودة الأولى '+CV_DAYS+'.'],['هل بياناتي سرية؟','نعم، تُستخدم لإعداد سيرتك فقط ولا تُشارَك.'],['أحتاج تعديلاً بعد الاستلام؟','التعديلات المجانية حسب باقتك، وبعدها بسعر رمزي.'],['لا أعرف ماذا أكتب في الخبرات؟','اكتب ما تتذكره ونكمل معك عبر الواتساب.']].map(([a,b])=>`<details class="c" style="margin-bottom:10px"><summary style="cursor:pointer;font-weight:700">${a}</summary><p style="margin-top:8px">${b}</p></details>`).join('');
  return`<a class="mu" href="#/sections">← رجوع للأقسام</a><h2>${s.i} ${s.t}</h2><p class="mu">${s.d}</p>
<h2>اختر باقتك</h2><div class="g">${pk}</div>
<h2>كيف نشتغل</h2><div class="g st4">${steps}</div>
<h2>لماذا نحن</h2><div class="g">${feats}</div>${smp}
<h2>اطلب سيرتك الآن</h2><div class="c" id="cvf"><p class="mu">الباقة المختارة: <b id="cvp">${esc(CV_PKGS[cvPkg].n)}</b></p>${user?'':guestFields}
<label>الوظيفة المستهدفة *</label><input id="cj" maxlength="60"><label>الخبرات العملية</label><textarea id="ce" rows="3" maxlength="250"></textarea>
<label>المؤهلات الدراسية</label><textarea id="cd" rows="2" maxlength="120"></textarea><label>المهارات</label><textarea id="cs" rows="2" maxlength="150"></textarea>
<label>لغة السيرة</label><select id="cl" style="width:100%;margin:6px 0 12px"><option>عربي</option><option>إنجليزي</option><option>عربي وإنجليزي</option></select>
<label>رابط سيرتك الحالية (إن وجدت)</label><input id="cu" maxlength="80"><textarea id="nt" style="display:none"></textarea>
<button class="btn" onclick="cvSend()">إرسال الطلب</button><div id="st"></div></div>
<h2>أسئلة شائعة</h2>${q}`}
function cvSel(i){cvPkg=i;document.querySelectorAll('.pk').forEach((e,j)=>{e.classList.toggle('sel',j===i);e.querySelector('button').classList.toggle('o',j!==i)});$('#cvp').textContent=CV_PKGS[i].n;$('#cvf').scrollIntoView({behavior:'smooth'})}
function cvSend(){const v=i=>$('#'+i).value.trim(),k=CV_PKGS[cvPkg];
  if(!v('cj')){$('#st').innerHTML='<div class="msg">اكتب الوظيفة المستهدفة</div>';return}
  $('#nt').value=`الباقة: ${k.n} (${k.p})\nالوظيفة: ${v('cj')}\nالخبرات: ${v('ce')}\nالمؤهلات: ${v('cd')}\nالمهارات: ${v('cs')}\nاللغة: ${v('cl')}\nرابط: ${v('cu')}`;
  req('سيرة ذاتية - '+k.n)}
function authForm(reg){return`<div class="box c"><h2 style="margin-top:0">${reg?'إنشاء حساب':'تسجيل الدخول'}</h2>
${reg?'<label>الاسم</label><input id="n"><label>الجوال</label><input id="p" type="tel">':''}
<label>البريد الإلكتروني</label><input id="e" type="email"><label>كلمة المرور</label><input id="w" type="password"${reg?` oninput="pwHint('ph',this.value)"`:''}>${reg?`<div id="ph" style="margin:-6px 0 12px">${hintHtml('')}</div>`:''}
<button class="btn" style="width:100%" onclick="auth(${reg})">${reg?'تسجيل':'دخول'}</button><div id="st"></div>${reg?'':'<p style="margin-top:10px"><a href="#/forgot" style="color:var(--ac)">نسيت كلمة المرور؟</a></p>'}
<p class="mu" style="margin-top:12px">${reg?'لديك حساب؟ <a href="#/login" style="color:var(--ac)">سجّل دخولك</a>':'ليس لديك حساب؟ <a href="#/register" style="color:var(--ac)">أنشئ حساباً</a>'}</p></div>`}
async function auth(reg){
  const d={email:$('#e').value.trim(),pass:$('#w').value};
  if(reg){d.name=$('#n').value.trim();d.phone=$('#p').value.trim()}
  if(!d.email||!d.pass||(reg&&!d.name)){$('#st').innerHTML='<div class="msg">أكمل جميع الحقول</div>';return}
  if(reg&&!pwOk(d.pass)){$('#st').innerHTML='<div class="msg">كلمة المرور لا تحقق الشروط</div>';return}
  const r=await api(reg?'register':'login',d);
  if(r.ok)setUser(r);else $('#st').innerHTML=`<div class="msg">${esc(r.msg)}</div>`;
}

let tab='users';
async function admin(){
  if(!user||user.role!=='admin'){location.hash='#/';return''}
  const r=await api('adminData');if(!r.ok)return`<div class="msg">${esc(r.msg)}</div>`;
  const T=(k,l)=>`<button class="btn ${tab===k?'':'o'}" onclick="tab='${k}';route()">${l}</button>`;
  let h=`<h2>لوحة الأدمن</h2><div class="tabs">${T('users','المستخدمون ('+r.users.length+')')}${T('reqs','الطلبات ('+r.requests.length+')')}${T('prods','المنتجات ('+r.products.length+')')}</div><div class="ov">`;
  if(tab==='users')h+=`<table><tr><th>الاسم</th><th>البريد</th><th>الجوال</th><th>الصلاحية</th><th></th></tr>${r.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.phone)}</td><td>${u.role==='admin'?'أدمن':'عميل'}</td><td>${u.id===user.id?'':`<button class="btn o" style="padding:5px 10px" onclick="adm('setRole',{id:'${u.id}',role:'${u.role==='admin'?'user':'admin'}'})">${u.role==='admin'?'إلغاء أدمن':'ترقية لأدمن'}</button> <button class="btn d" onclick="adm('deleteUser',{id:'${u.id}'},1)">حذف</button>`}</td></tr>`).join('')}</table>`;
  if(tab==='reqs')h+=`<table><tr><th>التاريخ</th><th>العميل</th><th>الخدمة</th><th>التفاصيل</th><th>الحالة</th><th></th></tr>${r.requests.map(q=>`<tr><td>${esc(q.date.slice(0,10))}</td><td>${esc(q.name)}${q.guest?' <span class="mu">(ضيف)</span>':''}<br><span class="mu">${esc(q.phone)}</span></td><td>${esc(q.service)}</td><td>${esc(q.note)}</td><td><select onchange="adm('setStatus',{id:'${q.id}',status:this.value})">${['جديد','قيد التنفيذ','مكتمل'].map(x=>`<option${(q.status||'جديد')===x?' selected':''}>${x}</option>`).join('')}</select></td><td><button class="btn d" onclick="adm('deleteRequest',{id:'${q.id}'},1)">حذف</button></td></tr>`).join('')}</table>`;
  if(tab==='prods')h+=`<div class="c" style="margin-bottom:16px"><h3>إضافة منتج</h3><input id="pn" placeholder="اسم المنتج"><input id="pp" placeholder="السعر"><input id="pd" placeholder="الوصف"><input id="pi" placeholder="رابط صورة المنتج (اختياري)"><button class="btn" onclick="addP()">إضافة</button></div><table>${r.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.price)}</td><td>${esc(p.desc)}</td><td><button class="btn d" onclick="adm('deleteProduct',{id:'${p.id}'},1)">حذف</button></td></tr>`).join('')}</table>`;
  return h+'</div>';
}
async function adm(a,d,c){if(c&&!confirm('متأكد؟'))return;const r=await api(a,d);if(!r.ok)alert(r.msg);route()}
function addP(){adm('addProduct',{name:$('#pn').value,price:$('#pp').value,desc:$('#pd').value,img:$('#pi').value})}

async function route(){
  nav();const h=(location.hash.slice(2)||'').split('/');let v='';
  const m=$('#app');m.innerHTML='<p class="mu" style="padding:40px 0">جارٍ التحميل…</p>';
  if(user&&user.mustChange)h[0]='password';
  if(h[0]==='sections')v=sections();
  else if(h[0]==='password')v=passPage();
  else if(h[0]==='s')v=await section(h[1]);
  else if(h[0]==='login')v=authForm(0);
  else if(h[0]==='register')v=authForm(1);
  else if(h[0]==='admin')v=await admin();
  else if(h[0]==='my')v=await my();
  else if(h[0]==='forgot')v=forgot();
  else v=home();
  m.innerHTML=v;scrollTo(0,0);
}
$('#wa').href='https://wa.me/'+CONTACT.whatsapp.replace(/\D/g,'');
addEventListener('hashchange',route);route();
</script>
</body>
</html>
