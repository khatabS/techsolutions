<script>
// ===== فحص النسخة وتنظيف الكاش تلقائياً (لا يمس تسجيل الدخول ولا بيانات المستخدم) =====
// عند كل تحديث غيّر رقم النسخة هنا (v4 ← v5 ...) وسيتحدّث الموقع عند الزوار تلقائياً
const APP_VER='v11';
async function checkAndClear(){
  try{
    const res=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'});
    if(!res.ok)return;
    const m=(await res.text()).match(/APP_VER\s*=\s*'([^']+)'/);
    if(!m||m[1]===APP_VER)return;
    const flag='reloaded_'+m[1];
    if(sessionStorage.getItem(flag))return;
    sessionStorage.setItem(flag,'1');
    if(navigator.serviceWorker){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}
    if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}
    const u=new URL(location.href);u.searchParams.set('v',m[1]);location.replace(u.toString());
  }catch(e){}
}
checkAndClear();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkAndClear()});
</script>

  const T=(k,l)=>`<button class="btn ${tab===k?'':'o'}" onclick="tab='${k}';route()">${l}</button>`;
  let h=`<h2>لوحة الأدمن</h2><div class="tabs">${T('users','المستخدمون ('+r.users.length+')')}${T('reqs','الطلبات ('+r.requests.length+')')}${T('prods','المنتجات ('+r.products.length+')')}${T('prices','الأسعار والخصومات')}${T('hide','الإخفاء والإظهار')}${T('pay','طرق الدفع')}</div><div class="ov">`;
  if(tab==='users')h+=`<table><tr><th>الاسم</th><th>البريد</th><th>الجوال</th><th>الصلاحية</th><th></th></tr>${r.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.phone)}</td><td>${u.role==='admin'?'أدمن':'عميل'}</td><td>${u.id===user.id?'':`<button class="btn o" style="padding:5px 10px" onclick="adm('setRole',{id:'${u.id}',role:'${u.role==='admin'?'user':'admin'}'})">${u.role==='admin'?'إلغاء أدمن':'ترقية لأدمن'}</button> <button class="btn d" onclick="adm('deleteUser',{id:'${u.id}'},1)">حذف</button>`}</td></tr>`).join('')}</table>`;
  if(tab==='reqs')h+=`<table><tr><th>التاريخ</th><th>العميل</th><th>الخدمة</th><th>التفاصيل</th><th>الحالة</th><th></th></tr>${r.requests.map(q=>`<tr><td>${esc(q.date.slice(0,10))}<br><span class="mu">#${q.num||''}</span></td><td>${esc(q.name)}${q.guest?' <span class="mu">(ضيف)</span>':''}<br><span class="mu">${esc(q.phone)}</span></td><td>${esc(q.service)}${q.due?`<br><span class="mu">المطلوب: ${q.due} من ${q.amt} ر.ع</span>`:''}</td><td>${esc(q.note)}</td><td><select onchange="adm('setStatus',{id:'${q.id}',status:this.value})">${['جديد','بانتظار الدفع','مدفوع','قيد التنفيذ','مكتمل'].map(x=>`<option${(q.status||'جديد')===x?' selected':''}>${x}</option>`).join('')}</select>${q.sid&&q.status==='بانتظار الدفع'?`<br><button class="btn o" style="padding:5px 10px;margin-top:6px" onclick="checkPay(${q.num})">تحقق من الدفع</button>`:''}</td><td><button class="btn d" onclick="adm('deleteRequest',{id:'${q.id}'},1)">حذف</button></td></tr>`).join('')}</table>`;
  if(tab==='prods')h+=`<div class="c" style="margin-bottom:16px"><h3>إضافة منتج</h3><input id="pn" placeholder="اسم المنتج"><input id="pp" placeholder="السعر"><input id="pd" placeholder="الوصف"><input id="pi" placeholder="رابط صورة المنتج (اختياري)"><button class="btn" onclick="addP()">إضافة</button></div><table><tr><th>المنتج</th><th>السعر</th><th>خصم %</th><th></th></tr>${r.products.map(p=>`<tr><td>${esc(p.name)}<br><span class="mu">${esc(p.desc)}</span></td><td><input class="pn" value="${esc(p.price)}" style="width:110px"></td><td><input class="po" type="number" min="0" max="90" value="${p.off||0}" style="width:70px"></td><td><button class="btn" onclick="saveProd('${p.id}',this)">حفظ</button> <button class="btn o" style="padding:9px 12px" onclick="tg('prod:${p.id}')">${hid('prod:'+p.id)?'إظهار':'إخفاء'}</button> <button class="btn d" onclick="adm('deleteProduct',{id:'${p.id}'},1)">حذف</button></td></tr>`).join('')}</table>`;
  if(tab==='prices'){const gl=PR.gl||{off:0,label:''};
    const rows=[['السيرة الذاتية','cv',CV_PKGS],['الشبكات والكاميرات','net',NET_PKGS],['تصميم المواقع','web',WEB_PKGS],['الدعم الفني: الأسعار','sup',SUP_PRICES],['الدعم الفني: الصيانة','sm',SUP_PLANS]].map(([sec,k,A])=>A.map((x,i)=>{const key=k+':'+i,c=calc(key,x.p),o=(PR.prices||{})[key]||{};
      return`<tr><td>${sec}: ${esc(x.n||x.t)}</td><td><input class="pn" type="number" step="0.01" value="${c.base}" style="width:90px"></td><td><input class="po" type="number" min="0" max="90" value="${o.off||0}" style="width:70px"></td><td><button class="btn" onclick="savePrice('${key}',this)">حفظ</button> <button class="btn o" style="padding:9px 12px" onclick="resetPrice('${key}')">افتراضي</button></td></tr>`}).join('')).join('');
    h+=`<div class="c" style="margin-bottom:16px"><h3>خصم عام على كل الأسعار</h3><label>نسبة الخصم %</label><input id="go" type="number" min="0" max="90" value="${gl.off||0}"><label>نص العرض (يظهر للعميل)</label><input id="gl" value="${esc(gl.label)}" maxlength="60"><button class="btn" onclick="saveGlobal()">حفظ الخصم العام</button><p class="mu" style="margin-top:8px">الخصم الخاص بباقة معينة يتقدم على الخصم العام. ضع 0 لإلغاء الخصم.</p></div><table><tr><th>الباقة</th><th>السعر (ر.ع)</th><th>خصم %</th><th></th></tr>${rows}</table><p class="mu" style="margin-top:8px">أسعار المنتجات تعدلها من تبويب المنتجات.</p>`}
  if(tab==='hide'){const row=(l,k)=>`<tr><td>${l}</td><td>${hid(k)?'🚫 مخفي':'✅ ظاهر'}</td><td><button class="btn${hid(k)?'':' o'}" style="padding:7px 14px" onclick="tg('${k}')">${hid(k)?'إظهار':'إخفاء'}</button></td></tr>`;
    const secs=S.map(x=>row(x.i+' '+x.t,'sec:'+x.id)).join('');
    const pkgs=[['السيرة','cv',CV_PKGS],['الكاميرات','net',NET_PKGS],['المواقع','web',WEB_PKGS],['الدعم: الأسعار','sup',SUP_PRICES],['الدعم: الصيانة','sm',SUP_PLANS]].map(([n,k,A])=>A.map((x,i)=>row(n+': '+(x.n||x.t),k+':'+i)).join('')).join('');
    const blks=Object.entries(HBLK).map(([k,A])=>A.map(t=>row(S.find(x=>x.id===k).t+': '+t,'blk:'+k+':'+t)).join('')).join('');
    h+=`<h3>الأقسام</h3><table>${secs}</table><h3 style="margin-top:20px">الباقات</h3><table>${pkgs}</table><h3 style="margin-top:20px">أجزاء الصفحات</h3><table>${blks}</table><p class="mu" style="margin-top:8px">المخفي لا يراه العملاء. المنتجات تخفيها من تبويب المنتجات.</p>`}
  if(tab==='pay'){h+=`<div class="c" style="margin-bottom:16px"><h3>إضافة طريقة دفع</h3><label>النوع</label><select id="yt" style="width:100%;margin:6px 0 12px"><option value="bank">تحويل بنكي</option><option value="phone">تحويل بالهاتف</option></select><input id="yn" placeholder="اسم البنك أو الخدمة"><input id="yh" placeholder="اسم صاحب الحساب"><input id="yu" placeholder="رقم الحساب أو الآيبان أو رقم الهاتف"><input id="yo" placeholder="ملاحظة (اختياري)"><button class="btn" onclick="addPay()">إضافة</button></div>
<div class="c" style="margin-bottom:16px"><h3>نسبة العربون (الكاميرات والمواقع)</h3><input id="dp" type="number" min="0" max="100" value="${dep()}"><button class="btn" onclick="adm('setDep',{dep:parseFloat($('#dp').value)})">حفظ</button></div>
<table>${(r.pay||[]).map(m=>`<tr><td>${m.type==='phone'?'📱':'🏦'} ${esc(m.name)}<br><span class="mu">${esc(m.holder)}</span></td><td style="direction:ltr">${esc(m.num)}</td><td><button class="btn o" style="padding:7px 12px" onclick="tg('pay:${m.id}')">${hid('pay:'+m.id)?'إظهار':'إخفاء'}</button> <button class="btn d" onclick="adm('deletePay',{id:'${m.id}'},1)">حذف</button></td></tr>`).join('')}</table>`}
  return h+'</div>';
}
const rowV=b=>{const t=b.closest('tr');return[t.querySelector('.pn').value,parseFloat(t.querySelector('.po').value)||0]};
async function savePrice(key,b){const[n,off]=rowV(b);await adm('setPrice',{key,n:n===''?null:parseFloat(n),off});PR=null;route()}
async function resetPrice(key){await adm('setPrice',{key,reset:true},1);PR=null;route()}
async function saveGlobal(){await adm('setGlobal',{off:parseFloat($('#go').value)||0,label:$('#gl').value});PR=null;route()}
async function saveProd(id,b){const[price,off]=rowV(b);await adm('updateProduct',{id,price,off})}
function addPay(){adm('addPay',{type:$('#yt').value,name:$('#yn').value,holder:$('#yh').value,num:$('#yu').value,note:$('#yo').value})}
async function adm(a,d,c){if(c&&!confirm('متأكد؟'))return;const r=await api(a,d);if(!r.ok)alert(r.msg);PR=null;route()}
function addP(){adm('addProduct',{name:$('#pn').value,price:$('#pp').value,desc:$('#pd').value,img:$('#pi').value})}

async function route(){
  nav();const h=(location.hash.slice(2)||'').split('/');let v='';
  const m=$('#app');m.innerHTML='<p class="mu" style="padding:40px 0">جارٍ التحميل…</p>';
  if(PR===null)await loadPrices();
  if(user&&user.mustChange)h[0]='password';
  if(h[0]==='sections')v=sections();
  else if(h[0]==='password')v=passPage();
  else if(h[0]==='s')v=await section(h[1]);
  else if(h[0]==='login')v=authForm(0);
  else if(h[0]==='register')v=authForm(1);
  else if(h[0]==='admin')v=await admin();
  else if(h[0]==='my')v=await my();
  else if(h[0]==='paid')v=await paidPage(h[1]);
  else if(h[0]==='paycancel')v='<div class="box c" style="text-align:center"><h2 style="margin-top:0">تم إلغاء الدفع</h2><p>طلبك محفوظ، وتقدر تدفع لاحقاً بالتحويل اليدوي أو تتواصل معنا واتساب.</p><a class="btn" href="#/">الرئيسية</a></div>';
  else if(h[0]==='forgot')v=forgot();
  else v=home();
  m.innerHTML=(['admin','login','register','forgot','password'].includes(h[0])?'':gbanner())+v;if(h[0]==='s')applyHide(h[1]);scrollTo(0,0);
}
$('#wa').href='https://wa.me/'+CONTACT.whatsapp.replace(/\D/g,'');
(function(){const q=new URLSearchParams(location.search),n=q.get('n');if(n&&q.get('pay'))history.replaceState(null,'',location.pathname+'#/'+(q.get('pay')==='ok'?'paid':'paycancel')+'/'+encodeURIComponent(n))})();
$('#ver').textContent=APP_VER;
addEventListener('hashchange',route);route();
</script>
</body>
