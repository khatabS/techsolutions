// ===== فحص النسخة وتنظيف الكاش تلقائياً (لا يمس تسجيل الدخول ولا بيانات المستخدم) =====
// عند كل تحديث غيّر رقم النسخة هنا (v4 ← v5 ...) وسيتحدّث الموقع عند الزوار تلقائياً
const APP_VER='v17';
async function checkAndClear(){
  try{
    const res=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'});
    if(!res.ok)return;
    const m=(await res.text()).match(/APP_VER\s*=\s*'([^']+)'/);
    if(!m||m[1]===APP_VER)return;
    const flag='reloaded_'+m[1];
    if(sessionStorage.getItem(flag))return;
    sessionStorage.setItem(flag,'1');
    if(navigator.serviceWorker){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}
    if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}
    const u=new URL(location.href);u.searchParams.set('v',m[1]);location.replace(u.toString());
  }catch(e){}
}
checkAndClear();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkAndClear()});
</script>

<h2>خدماتنا</h2><div class="g">${S.filter(s=>!hid('sec:'+s.id)).map(s=>`<div class="c"><div class="i">${s.i}</div><h3>${s.t}</h3><p>${s.d}</p></div>`).join('')}</div>${gallery()}${reviews()}${faq()}${contact()}`}

function reviews(){return REVIEWS.length?`<h2>آراء العملاء</h2><div class="g">${REVIEWS.map(r=>`<div class="c"><p>“${esc(r.t)}”</p><h3 style="font-size:16px">— ${esc(r.n)}</h3></div>`).join('')}</div>`:''}
function faq(){return`<h2>الأسئلة الشائعة</h2>${FAQ.map(f=>`<details class="c" style="margin-bottom:10px"><summary style="cursor:pointer;font-weight:700">${esc(f.q)}</summary><p style="margin-top:8px">${esc(f.a)}</p></details>`).join('')}`}
async function my(){if(!user){location.hash='#/login';return''}const r=await api('myRequests');if(!r.ok)return`<div class="msg">${esc(r.msg)}</div>`;
return`<h2>طلباتي</h2>`+(r.requests.length?`<div class="ov"><table><tr><th>التاريخ</th><th>الخدمة</th><th>الحالة</th></tr>${r.requests.map(q=>`<tr><td>${esc(q.date.slice(0,10))}<br><span class="mu">#${q.num||''}</span></td><td>${esc(q.service)}${q.due?`<br><span class="mu">المطلوب: ${q.due} من ${q.amt} ر.ع</span>`:''}</td><td>${esc(q.status||'جديد')}</td></tr>`).join('')}</table></div>`:'<div class="msg">لا توجد طلبات بعد</div>')}
const PWR=[['8 أحرف على الأقل',p=>p.length>=8],['حرف إنجليزي',p=>/[A-Za-z]/.test(p)],['رقم',p=>/\d/.test(p)],['رمز مثل !@#$%',p=>/[^A-Za-z0-9]/.test(p)]];
const pwOk=p=>PWR.every(r=>r[1](p));
const hintHtml=v=>PWR.map(r=>`<div class="mu">${r[1](v)?'✅':'⬜'} ${r[0]}</div>`).join('');
const pwHint=(id,v)=>{$('#'+id).innerHTML=hintHtml(v)};
function passPage(){if(!user){location.hash='#/login';return''}
return`<div class="box c"><h2 style="margin-top:0">تغيير كلمة المرور</h2>${user.mustChange?'<div class="msg">دخلت بكلمة مؤقتة، اختر كلمة مرور جديدة للمتابعة</div>':''}<label>كلمة المرور الحالية</label><input id="o" type="password"><label>كلمة المرور الجديدة</label><input id="w1" type="password" oninput="pwHint('ph',this.value)"><div id="ph" style="margin:-6px 0 12px">${hintHtml('')}</div><label>تأكيد كلمة المرور الجديدة</label><input id="w2" type="password"><button class="btn" style="width:100%" onclick="chp()">حفظ</button><div id="st"></div></div>`}
async function chp(){const a=$('#w1').value,m=t=>$('#st').innerHTML=`<div class="msg">${t}</div>`;
if(!pwOk(a))return m('كلمة المرور الجديدة لا تحقق الشروط');

const r=await api('changePass',{old:$('#o').value,pass:a});
if(!r.ok)return m(esc(r.msg));
user=r.user;localStorage.setItem('u',JSON.stringify(user));nav();m('تم تغيير كلمة المرور ✅');setTimeout(()=>location.hash='#/sections',1200)}
function forgot(){return`<div class="box c"><h2 style="margin-top:0">استعادة كلمة المرور</h2><label>البريد الإلكتروني</label><input id="e" type="email"><button class="btn" style="width:100%" onclick="fg()">إرسال كلمة مرور مؤقتة</button><div id="st"></div></div>`}
async function fg(){const r=await api('forgot',{email:$('#e').value.trim()});$('#st').innerHTML=`<div class="msg">${r.ok?'إذا كان البريد مسجلاً وصلتك كلمة مرور مؤقتة (تفقد الرسائل غير المرغوبة)':esc(r.msg)}</div>`}
function contact(){
  const C=CONTACT,d=v=>String(v).replace(/\D/g,'');
  const it=[
    C.phone&&['📞','اتصل بنا',C.phone,'tel:'+d(C.phone)],
    C.whatsapp&&['💬','واتساب',C.whatsapp,'https://wa.me/'+d(C.whatsapp)],
    C.email&&['✉️','البريد الإلكتروني',C.email,'mailto:'+C.email],
    C.address&&['📍','العنوان',C.address,''],
    C.hours&&['🕒','أوقات العمل',C.hours,''],
    C.instagram&&['📷','انستقرام','@'+C.instagram.replace('@',''),'https://instagram.com/'+C.instagram.replace('@','')],
    C.x&&['𝕏','منصة X','@'+C.x.replace('@',''),'https://x.com/'+C.x.replace('@','')],
    C.snapchat&&['👻','سناب شات',C.snapchat,'https://snapchat.com/add/'+C.snapchat]
  ].filter(Boolean);
  if(!it.length)return'';
  return`<h2>تواصل معنا</h2><div class="ct">${it.map(([i,l,v,h])=>{
    const b=`<span class="i">${i}</span><span><small>${l}</small><b>${esc(v)}</b></span>`;
    return h?`<a href="${esc(h)}" target="_blank" rel="noopener">${b}</a>`:`<div>${b}</div>`}).join('')}</div>`;
}

function sections(){
  return`<h2>الأقسام</h2><div class="g">${S.filter(s=>!hid('sec:'+s.id)).map(s=>`<a class="c" href="#/s/${s.id}"><div class="i">${s.i}</div><h3>${s.t}</h3><p>${s.d}</p></a>`).join('')}</div>`}

async function section(id){
  const s=S.find(x=>x.id===id);if(!s)return'<p>القسم غير موجود</p>';
  if(hid('sec:'+id))return'<a class="mu" href="#/sections">← رجوع للأقسام</a><div class="msg">هذا القسم غير متاح حالياً</div>';
  if(id==='shop')return storePage(s);
  if(id==='cv')return cvPage(s);
  if(id==='net')return netPage(s);
  if(id==='web')return webPage(s);
  if(id==='support')return supPage(s);
  if(id==='train')return await trainPage(s);
  let h=`<a class="mu" href="#/sections">← رجوع للأقسام</a><h2>${s.i} ${s.t}</h2><p class="mu">${s.d}</p>`;
  if(id==='shop'){
    const r={ok:true,products:PR.products||[]};
    h+=r.ok&&r.products.length?`<div class="g" style="margin-top:16px">${r.products.map(p=>`<div class="c">${p.img?`<img src="${esc(p.img)}" alt="" style="width:100%;height:170px;object-fit:cover;border-radius:10px;margin-bottom:8px">`:''}<h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p>${pr(null,p.price,22,{off:p.off})}<button class="btn" onclick="req('منتج: ${esc(p.name).replace(/'/g,'')}',{full:${amtOf(null,p.price,{off:p.off})},key:'prod:${p.id}'})">اطلب الآن</button></div>`).join('')}</div>`
      :`<div class="msg">${r.ok?(localStorage.getItem('pub')?'لا توجد منتجات حالياً':'جارٍ تحميل المنتجات…'):esc(r.msg)}</div>`;
    if(!user)h+=`<div class="c" style="margin-top:16px"><h3>بياناتك للطلب</h3>${guestFields}</div>`;
  }else{
    h+=`<ul class="l">${s.l.map(x=>`<li>${x}</li>`).join('')}</ul><div class="c"><h3>اطلب الخدمة</h3>${user?'':guestFields}<label>تفاصيل طلبك</label><textarea id="nt" rows="4"></textarea><button class="btn" onclick="req('${s.t}')">إرسال الطلب</button></div>`;
  }
  return h+'<div id="st"></div>';
}
async function req(service,pay){
  const n=$('#nt')?$('#nt').value:'',show=t=>($('#st')||document.body.appendChild(Object.assign(document.createElement('div'),{id:'st'}))).innerHTML=`<div class="msg">${t}</div>`;
  const full=pay&&pay.full>0?pay.full:0,due=full?(pay.dep?Math.round(full*dep()*10)/1000:full):0,x={service,note:n,amt:full,due,course:pay&&pay.course?pay.course:'',key:full&&pay.key?pay.key:'',mode:pay&&pay.dep?'dep':'full'};
  let r;
  if(user)r=await api('sendRequest',x);
  else{const nm=($('#gn')||{value:''}).value.trim(),ph=($('#gp')||{value:''}).value.trim();
    if(!nm||!/^\+?[\d\s]{7,15}$/.test(ph))return show('أدخل اسمك ورقم جوال صحيح في الخانات');
    r=await api('guestRequest',{...x,name:nm,phone:ph,hp:($('#hp')||{value:''}).value})}
  if(!r.ok)return show(esc(r.msg));
  if(r.due>0){show('');return payBox(r.num,r.due,full,!!pay.dep)}
  show('تم إرسال طلبك بنجاح ✅'+(r.num?' رقم الطلب: '+r.num:'')+' وسنتواصل معك قريباً');
}

let shopCat='',shopQ='',pqN=1;
function pcard(p){const im=imgsOf(p)[0],l=stockLeft(p),n=amtOf(null,p.price,{off:p.off});
  return`<div class="c pc" onclick="location.hash='#/p/${p.id}'"><div class="im">${im?`<img src="${esc(im)}" alt="" loading="lazy">`:'📦'}</div>${p.badge?`<span class="bdg">${esc(p.badge)}</span>`:''}<div class="bx"><h3 style="font-size:16px">${esc(p.name)}</h3>${p.cat?`<p class="mu">${esc(p.cat)}</p>`:''}${pr(null,p.price,20,{off:p.off})}<p style="font-size:13px;margin:4px 0">${l===0?'<span class="dsc">نفدت الكمية</span>':l<=5?`<b style="color:#f5a524">باقي ${l} فقط</b>`:'&nbsp;'}</p>${n!=null&&l>0?`<button class="btn" style="width:100%" onclick="event.stopPropagation();addCart('${p.id}')">أضف للسلة 🛒</button>`:`<a class="btn o" style="width:100%;text-align:center" target="_blank" rel="noopener" href="${waLink('استفسار عن المنتج: '+p.name)}" onclick="event.stopPropagation()">${l===0?'استفسر عن التوفر':'اطلب عبر واتساب'}</a>`}</div></div>`}
function shopGrid(){const q=shopQ.trim().toLowerCase(),L=(PR.products||[]).filter(p=>(!shopCat||p.cat===shopCat)&&(!q||(p.name+' '+(p.desc||'')+' '+(p.cat||'')).toLowerCase().includes(q)));
  return L.length?L.map(pcard).join(''):`<div class="c"><p>${(PR.products||[]).length?'لا توجد منتجات مطابقة':(localStorage.getItem('pub')?'لا توجد منتجات حالياً':'جارٍ تحميل المنتجات…')}</p></div>`}
function shopFilter(){const g=$('#sg');if(g)g.innerHTML=shopGrid()}
function setCat(c){shopCat=c;document.querySelectorAll('.chip').forEach(e=>e.classList.toggle('on',e.dataset.c===c));shopFilter()}
function storePage(s){
  const cats=[...new Set((PR.products||[]).map(p=>p.cat).filter(Boolean))];
  const chips=cats.length?`<div id="sc"><button class="chip${shopCat?'':' on'}" data-c="" onclick="setCat('')">الكل</button>${cats.map(c=>`<button class="chip${shopCat===c?' on':''}" data-c="${esc(c)}" onclick="setCat(this.dataset.c)">${esc(c)}</button>`).join('')}</div>`:'';
  const zn=(PR.zones||[]).length?(PR.zones).map(z=>`${esc(z.name)} (${z.fee} ر.ع)`).join(' • '):'الرسوم تُحدد عند التواصل';
  const q=SHOP_FAQ.map(([a,b])=>`<details class="c" style="margin-bottom:10px"><summary style="cursor:pointer;font-weight:700">${a}</summary><p style="margin-top:8px">${b}</p></details>`).join('');
  return`<a class="mu" href="#/sections">← رجوع للأقسام</a><h2>${s.i} ${s.t}</h2><p class="mu">${s.d}</p>
${user&&user.role==='admin'?`<div class="c" style="margin:12px 0;border-color:var(--ac2)"><b>⚙️ أنت أدمن:</b> <button class="btn" style="margin:6px 0 0" onclick="tab='prods';location.hash='#/admin'">إدارة المنتجات وإضافة منتج جديد</button></div>`:''}<div style="margin:14px 0 8px"><input id="sq" placeholder="🔍 ابحث عن منتج..." value="${esc(shopQ)}" oninput="shopQ=this.value;shopFilter()"></div>${chips}<div class="g" id="sg">${shopGrid()}</div>
<h2>التوصيل والاستلام</h2><div class="c"><p>🚚 التوصيل: ${zn}</p><p style="margin-top:6px">🏪 ${esc(SHOP_PICKUP)}</p>${SHOP_COD?'<p style="margin-top:6px">💵 الدفع عند الاستلام متاح</p>':''}</div>
<h2>سياسة الضمان والاسترجاع</h2><div class="c"><p>🛡️ ${esc(SHOP_WARRANTY)}</p><p style="margin-top:6px">↩️ ${esc(SHOP_RETURN)}</p></div>
<h2>أسئلة شائعة</h2>${q}`}
function productPage(id){
  const p=prodById(id);if(!p)return'<a class="mu" href="#/s/shop">← رجوع للمتجر</a><div class="msg">المنتج غير متوفر</div>';
  pqN=1;const im=imgsOf(p),l=stockLeft(p),n=amtOf(null,p.price,{off:p.off});
  const sp=(p.specs||'').split('\n').filter(Boolean).map(x=>{const i=x.indexOf(':');return i>0?`<tr><td class="mu">${esc(x.slice(0,i))}</td><td>${esc(x.slice(i+1).trim())}</td></tr>`:`<tr><td colspan="2">${esc(x)}</td></tr>`}).join('');
  const sim=(PR.products||[]).filter(x=>x.id!==p.id&&p.cat&&x.cat===p.cat).slice(0,4);
  return`<a class="mu" href="#/s/shop">← رجوع للمتجر</a>
<div class="c" style="margin-top:12px;padding:0;overflow:hidden">${im.length?`<img id="pm" src="${esc(im[0])}" alt="" style="width:100%;max-height:340px;object-fit:cover">`:'<div class="im" style="height:200px;display:flex;align-items:center;justify-content:center;font-size:64px">📦</div>'}${im.length>1?`<div style="display:flex;gap:8px;padding:10px;overflow-x:auto">${im.map(u=>`<img src="${esc(u)}" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:pointer" onclick="$('#pm').src=this.src">`).join('')}</div>`:''}</div>
<h2 style="margin-top:16px">${esc(p.name)} ${p.badge?`<span class="dsc" style="background:var(--ac2);color:#06101f">${esc(p.badge)}</span>`:''}</h2>${p.cat?`<p class="mu">${esc(p.cat)}</p>`:''}${pr(null,p.price,26,{off:p.off})}
<p style="margin:6px 0">${l===0?'<span class="dsc">نفدت الكمية</span>':l<=5?`<b style="color:#f5a524">باقي ${l} فقط</b>`:'<span style="color:var(--ac2)">متوفر</span>'}</p>${p.desc?`<p style="margin:10px 0">${esc(p.desc)}</p>`:''}
${n!=null&&l>0?`<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0"><span class="qty"><button onclick="pqty(-1,'${p.id}')">−</button><b id="pqv">1</b><button onclick="pqty(1,'${p.id}')">+</button></span><button class="btn" onclick="addCart('${p.id}',pqN)">أضف للسلة 🛒</button></div>`:''}
<a class="btn o" target="_blank" rel="noopener" href="${waLink('استفسار عن المنتج: '+p.name)}">💬 استفسر عن هذا المنتج</a>
${sp?`<h2>المواصفات</h2><div class="c ov"><table>${sp}</table></div>`:''}
<h2>الضمان والاسترجاع</h2><div class="c"><p>🛡️ ${esc(p.warranty||SHOP_WARRANTY)}</p><p style="margin-top:6px">↩️ ${esc(SHOP_RETURN)}</p></div>
${p.install?`<div class="c" style="margin-top:14px;border-color:var(--ac2)"><h3>🔧 تبي نركّبه لك؟</h3><p>فعّل خيار التركيب في السلة، أو شوف خدماتنا في قسم الشبكات والكاميرات.</p><a class="btn o" style="margin-top:8px" href="#/s/net">خدمات التركيب</a></div>`:''}
${sim.length?`<h2>منتجات مشابهة</h2><div class="g">${sim.map(pcard).join('')}</div>`:''}`}
function pqty(d,id){const p=prodById(id),mx=Math.min(50,stockLeft(p));pqN=Math.max(1,Math.min(mx,pqN+d));$('#pqv').textContent=pqN}
function addCart(id,q){q=q||1;const p=prodById(id);if(!p)return;const c=cartGet(),it=c.find(x=>x.id===id),nq=Math.min((it?it.q:0)+q,stockLeft(p),50);
  if(nq<=0)return toast('نفدت الكمية');if(it&&nq===it.q)return toast('وصلت للكمية المتاحة');
  if(it)it.q=nq;else c.push({id,q:nq});cartSet(c);toast('✅ أُضيف للسلة')}
function cartQ(id,d){const c=cartGet(),it=c.find(x=>x.id===id),p=prodById(id);if(!it||!p)return;it.q=Math.max(1,Math.min(it.q+d,stockLeft(p),50));cartSet(c);route(true)}
function cartDel(id){cartSet(cartGet().filter(x=>x.id!==id));route(true)}
function cartCalc(){const rows=cartGet().map(it=>({p:prodById(it.id),q:it.q})).filter(x=>x.p&&amtOf(null,x.p.price,{off:x.p.off})!=null);
  const sub=r3(rows.reduce((a,x)=>a+amtOf(null,x.p.price,{off:x.p.off})*x.q,0));
  const del=$('#sd')&&$('#sd').value==='توصيل',zs=$('#sz'),fee=del&&zs&&zs.selectedOptions[0]?+zs.selectedOptions[0].dataset.f||0:0;
  const t=$('#ct');if(t)t.innerHTML=`<p>المجموع: <b>${sub} ر.ع</b></p>${del?`<p>التوصيل: <b>${fee} ر.ع</b></p>`:''}<p class="price" style="font-size:22px">الإجمالي: ${r3(sub+fee)} ر.ع</p>`;
  const w=$('#sw');if(w)w.style.display=del?'':'none';return rows}
function cartPage(){
  const rows=cartGet().map(it=>({p:prodById(it.id),q:it.q})).filter(x=>x.p&&amtOf(null,x.p.price,{off:x.p.off})!=null);
  if(!rows.length)return`<h2>🛒 سلتك</h2><div class="c"><p>السلة فارغة.</p><a class="btn" style="margin-top:10px" href="#/s/shop">تصفح المنتجات</a></div>`;
  const zs=PR.zones||[],inst=rows.some(x=>x.p.install),sl='style="width:100%;margin:6px 0 12px"';
  const list=rows.map(({p,q})=>`<div class="c" style="margin-bottom:10px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap"><div style="flex:1;min-width:140px"><b>${esc(p.name)}</b>${pr(null,p.price,16,{off:p.off})}</div><span class="qty"><button onclick="cartQ('${p.id}',-1)">−</button><b>${q}</b><button onclick="cartQ('${p.id}',1)">+</button></span><button class="btn d" onclick="cartDel('${p.id}')">حذف</button></div>`).join('');
  return`<h2>🛒 سلتك</h2>${list}<div class="c" id="ct" style="margin:12px 0"></div>
<div class="c" id="cf"><h3>إتمام الطلب</h3>${user?'':guestFields}
<label>طريقة الاستلام</label><select id="sd" onchange="cartCalc()" ${sl}><option>توصيل</option><option>استلام من المقر</option></select>
<div id="sw">${zs.length?`<label>منطقة التوصيل</label><select id="sz" onchange="cartCalc()" ${sl}>${zs.map(z=>`<option value="${z.id}" data-f="${z.fee}">${esc(z.name)} — ${z.fee} ر.ع</option>`).join('')}</select>`:'<p class="mu" style="margin-bottom:8px">رسوم التوصيل تُحدد عند التواصل معك.</p>'}<label>عنوان التوصيل</label><textarea id="sa" rows="2" maxlength="200"></textarea></div>
<label>طريقة الدفع</label><select id="sy" ${sl}><option>تحويل بنكي</option>${SHOP_COD?'<option>عند الاستلام</option>':''}</select>
${inst?`<label style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><input id="si" type="checkbox" style="width:auto;margin:0"> أرغب بإضافة خدمة التركيب (يتواصل معك الفني)</label>`:''}
<label>ملاحظات</label><textarea id="sn" rows="2" maxlength="200"></textarea>
<button class="btn" id="cb" onclick="cartSend()">إرسال الطلب</button><div id="st"></div></div>${setTimeout(cartCalc,0)&&''}`}
async function cartSend(){
